name: Generar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Modelo de voz en español (sin internet)
        id: cache-modelo
        uses: actions/cache@v4
        with:
          path: modelo-es
          key: vosk-model-small-es-0.42

      - name: Descargar modelo de voz
        if: steps.cache-modelo.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o modelo.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          unzip -q modelo.zip
          mv vosk-model-small-es-0.42 modelo-es

      - name: Copiar modelo a la app
        run: |
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/modelo-es
          cp -r modelo-es app/src/main/assets/modelo-es
          echo "0.42" > app/src/main/assets/modelo-es/VERSION

      - name: Reconocimiento de voces (caché)
        id: cache-vozid
        uses: actions/cache@v4
        with:
          path: vozid-cache
          key: sherpa-1.12.40-campplus-v1

      - name: Descargar reconocimiento de voces
        if: steps.cache-vozid.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p vozid-cache && cd vozid-cache
          curl -sSL -o sherpa.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.40/sherpa-onnx-v1.12.40-android.tar.bz2
          tar xjf sherpa.tar.bz2 && rm sherpa.tar.bz2
          curl -sSL -o campplus.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx
          ls -la

      - name: Copiar reconocimiento de voces a la app
        run: |
          set -e
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p app/src/main/jniLibs/$abi
            cp vozid-cache/jniLibs/$abi/libsherpa-onnx-jni.so vozid-cache/jniLibs/$abi/libonnxruntime.so app/src/main/jniLibs/$abi/
          done
          cp vozid-cache/campplus.onnx app/src/main/assets/campplus.onnx
          du -sh app/src/main/jniLibs app/src/main/assets/campplus.onnx

      - name: Compilar APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk ODIN.apk

      - name: Publicar en Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: ODÍN v3.0.${{ github.run_number }}
          body: |
            Descarga **ODIN.apk** e instálalo en tu celular (Android 12 o superior).
            Desarrollado por VELKYRA · Soporte: velkyra3@gmail.com
          files: ODIN.apk
          make_latest: true

      - name: Guardar registro de compilación
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          echo "gemini=$([ -n "$GEMINI_API_KEY" ] && echo si || echo no) groq=$([ -n "$GROQ_API_KEY" ] && echo si || echo no) cerebras=$([ -n "$CEREBRAS_API_KEY" ] && echo si || echo no)" > /tmp/ia.txt
          mkdir -p /tmp/reg && cp build.log /tmp/reg/ 2>/dev/null || true
          ls -R modelo-es > /tmp/reg/modelo.txt 2>/dev/null || true
          find modelo-es -name "words.txt" -exec grep -iE "^(yar|jar|llar|har|gar|yab|jab)[a-z]*" {} \; >> /tmp/reg/modelo.txt 2>/dev/null || true
          git config user.name "ci"; git config user.email "ci@velkyra"
          git checkout --orphan registros
          git rm -rfq . > /dev/null
          cp /tmp/reg/* . 2>/dev/null || true
          echo "${{ job.status }} ia=$(cat /tmp/ia.txt)" > estado.txt
          git add -f build.log modelo.txt estado.txt 2>/dev/null || true
          git commit -qm "Registro run ${{ github.run_number }}" || true
          git push -f origin registros || true

  pc:
    # Programa para Windows: VELKYRA PC Link (controlar la laptop con ODÍN)
    needs: apk
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Crear VELKYRA_PC_Link.exe
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --onefile --noconsole --name VELKYRA_PC_Link pc/velkyra_pc_link.py
      - name: Publicar junto al APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          files: dist/VELKYRA_PC_Link.exe
